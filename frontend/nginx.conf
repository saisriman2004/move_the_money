server {
  listen 8080;
  listen [::]:8080;
  server_tokens off;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    # The API trusts one proxy hop (TRUST_PROXY=1) and reads the client IP from here.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location = /health {
    access_log off;
    return 200 'ok';
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
  }

  # Hashed asset filenames never change, so they can be cached for a long time.
  location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
